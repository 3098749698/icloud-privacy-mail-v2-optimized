services:
  ipm2:
    image: icloud-privacy-mail-v2:${APP_VERSION:-local}
    build:
      context: .
      args:
        APP_COMMIT: "${APP_COMMIT:-unknown}"
        APP_VERSION: "${APP_VERSION:-local}"
    container_name: icloud-privacy-mail-v2
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ipm2-data:/data
      - ./config.json:/config/config.json:ro
    command: ["-config", "/config/config.json"]
    ports:
      - "127.0.0.1:8788:8788"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8788/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  ipm2-data:
